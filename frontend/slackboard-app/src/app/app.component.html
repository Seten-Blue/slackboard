<div class="flex h-screen overflow-hidden bg-slack-dark relative">
  <app-sidebar *ngIf="showChrome"></app-sidebar>

  <button
    *ngIf="showChrome"
    (click)="logout()"
    class="absolute top-4 right-4 z-50 flex items-center gap-1.5 px-3 py-1.5 bg-white/5 hover:bg-white/10 text-white/60 hover:text-white text-xs font-medium rounded-lg backdrop-blur transition-colors"
    title="Cerrar sesion">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    Cerrar sesion
  </button>

  <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
    <router-outlet></router-outlet>
  </div>
</div>
