<aside class="w-72 h-full flex flex-col bg-ink-950 text-white relative overflow-hidden">
  <!-- Glow decorativo -->
  <div class="pointer-events-none absolute -top-24 -left-16 w-64 h-64 rounded-full bg-signal/20 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute top-1/3 -right-20 w-72 h-72 rounded-full bg-pulse/10 blur-3xl" aria-hidden="true"></div>

  <!-- Header / marca -->
  <div class="relative z-10 px-5 pt-6 pb-5 border-b border-white/10">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-signal flex items-center justify-center font-display font-bold text-sm">
        SB
      </div>
      <h1 class="font-display font-semibold text-lg tracking-tight">SlackBoard</h1>
    </div>
    <div class="flex items-center gap-1.5 mt-3 text-xs text-white/50">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pulse opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-pulse"></span>
      </span>
      Conectado en tiempo real
    </div>
  </div>

  <!-- Navegación -->
  <nav class="relative z-10 flex-1 min-h-0 overflow-y-auto px-3 py-5">
    <div class="mb-6">
      <ul class="space-y-0.5">
        <li>
          <a routerLink="/chat" routerLinkActive="bg-white/10 text-white"
             class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            Chat
          </a>
        </li>
        <li>
          <a routerLink="/dashboard" routerLinkActive="bg-white/10 text-white"
             class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-white/70 hover:bg-white/5 hover:text-white transition-colors text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Dashboard
          </a>
        </li>
      </ul>
    </div>

    <!-- Canales -->
    <div>
      <div class="flex items-center justify-between px-3 mb-2">
        <h3 class="text-[11px] uppercase tracking-wider text-white/40 font-semibold">Canales</h3>
        <button
          (click)="showCreateChannel = !showCreateChannel"
          class="w-5 h-5 rounded-md flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-colors text-base leading-none"
          title="Crear canal">
          +
        </button>
      </div>

      <!-- Crear canal -->
      <div *ngIf="showCreateChannel" class="mx-1 mb-3 p-3 rounded-lg bg-white/5 border border-white/10">
        <input
          type="text"
          [(ngModel)]="newChannelName"
          placeholder="nombre-del-canal"
          class="w-full px-2.5 py-1.5 bg-ink-950/60 border border-white/10 text-white text-sm rounded-md mb-2 outline-none focus:border-signal/60 placeholder:text-white/30"
          (keyup.enter)="createChannel()">
        <button
          (click)="createChannel()"
          class="w-full px-2.5 py-1.5 bg-signal hover:bg-signal/90 text-white text-sm font-medium rounded-md transition-colors">
          Crear canal
        </button>
      </div>

      <!-- Lista de canales -->
      <ul class="space-y-0.5">
       <li *ngFor="let channel of channels" 
    (click)="selectChannel(channel)"
    class="group flex items-center gap-2 pl-2.5 pr-2 py-1.5 rounded-lg cursor-pointer transition-colors relative"
    [ngClass]="currentChannel?._id === channel._id 
      ? 'bg-white/10 text-white' 
      : 'text-white/60 hover:bg-white/5 hover:text-white/90'">
          <span
            *ngIf="currentChannel?._id === channel._id"
            class="absolute left-0 top-1.5 bottom-1.5 w-0.5 rounded-full bg-signal"></span>
          <span class="text-white/40 text-sm font-mono w-3.5 text-center flex-shrink-0">{{ channel.isPrivate ? '🔒' : '#' }}</span>
          
          <div class="flex-1">


  <input
    *ngIf="editingChannel?._id === channel._id"
    [(ngModel)]="editedChannelName"
    (keyup.enter)="updateChannel()"
    (blur)="updateChannel()"
    class="w-full bg-transparent border-b border-signal outline-none text-sm text-white">

  <span
    *ngIf="editingChannel?._id !== channel._id"
    class="text-sm truncate block">

    {{ channel.name }}

  </span>

</div>
          <span *ngIf="channel.members?.length"
      class="text-[10px] font-mono text-white/30 flex-shrink-0">
  {{ channel.members.length }}
</span>

<div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">

  <button
    (click)="startEditing(channel); $event.stopPropagation()"
    class="text-white/40 hover:text-white p-1 rounded"
    title="Renombrar canal">

    ✏️

  </button>

  <button
    (click)="deleteChannel(channel); $event.stopPropagation()"
    class="text-white/40 hover:text-red-400 p-1 rounded"
    title="Abandonar canal">

    🚪

  </button>

</div>


        </li>
        

      </ul>

      <div *ngIf="loading" class="px-3 py-4 text-sm text-white/40">Cargando canales…</div>
      <div *ngIf="!loading && channels.length === 0" class="px-3 py-4 text-sm text-white/40">
        Aún no hay canales
      </div>
    </div>
  </nav>

  <!-- Footer / usuario -->
  <div class="relative z-10 px-4 py-3.5 border-t border-white/10 flex items-center gap-2.5">
    <div class="relative flex-shrink-0">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-signal to-pulse flex items-center justify-center text-xs font-semibold">
        A
      </div>
      <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-pulse border-2 border-ink-950"></span>
    </div>
    <div class="min-w-0">
      <p class="text-sm font-medium truncate">Admin</p>
      <p class="text-xs text-white/40">En línea</p>
    </div>
  </div>
</aside>
