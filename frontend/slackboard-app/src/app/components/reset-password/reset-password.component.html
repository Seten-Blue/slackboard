<div class="min-h-screen flex items-center justify-center bg-ink-950 px-4">
  <div class="w-full max-w-sm bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <h1 class="font-display font-semibold text-xl text-white text-center mb-6">Nueva contraseña</h1>

    <div *ngIf="tokenMissing" class="text-center">
      <p class="text-white/60 text-sm mb-4">Este link no es válido. Pedí uno nuevo.</p>
      <a routerLink="/forgot-password" class="text-signal text-sm font-medium hover:underline">Solicitar link</a>
    </div>

    <div *ngIf="success" class="text-center">
      <p class="text-white/80 text-sm">Contraseña actualizada. Redirigiendo al login…</p>
    </div>

    <form *ngIf="!tokenMissing && !success" (ngSubmit)="submit()" class="space-y-3.5">
      <div *ngIf="errorMsg" class="mb-1 px-3 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
        {{ errorMsg }}
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Nueva contraseña</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white transition-colors" />
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Confirmar contraseña</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white transition-colors" />
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full mt-2 py-3 rounded-lg bg-gradient-to-r from-signal to-signal/80 text-white font-medium text-sm disabled:opacity-50 transition-all">
        {{ loading ? 'Guardando…' : 'Restablecer contraseña' }}
      </button>
    </form>
  </div>
</div>
