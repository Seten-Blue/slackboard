<div class="min-h-screen flex items-center justify-center bg-ink-950 px-4">
  <div class="w-full max-w-sm bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <h1 class="font-display font-semibold text-xl text-white text-center mb-2">Recuperar contraseña</h1>
    <p class="text-sm text-white/40 text-center mb-6">Te mandamos un link para restablecerla.</p>

    <div *ngIf="errorMsg" class="mb-4 px-3 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      {{ errorMsg }}
    </div>

    <div *ngIf="sent" class="text-center">
      <p class="text-white/80 text-sm mb-4">Listo, revisá tu email. Si no lo ves, chequeá spam.</p>
      <a routerLink="/login" class="text-signal text-sm font-medium hover:underline">Volver al login</a>
    </div>

    <form *ngIf="!sent" (ngSubmit)="submit()" class="space-y-3.5">
      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Email</label>
        <input type="email" [(ngModel)]="email" name="email"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white transition-colors" />
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full mt-2 py-3 rounded-lg bg-gradient-to-r from-signal to-signal/80 text-white font-medium text-sm disabled:opacity-50 transition-all">
        {{ loading ? 'Enviando…' : 'Enviar link' }}
      </button>

      <p class="text-center text-sm text-white/40 mt-4">
        <a routerLink="/login" class="text-signal hover:underline">Volver al login</a>
      </p>
    </form>
  </div>
</div>
