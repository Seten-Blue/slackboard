<div class="h-full overflow-y-auto p-6" style="scrollbar-width: none; -ms-overflow-style: none;">
  <div class="mb-6">
    <h1 class="text-xl font-display font-bold text-ink-950">Dashboard</h1>
    <p class="text-sm text-ink-950/50 mt-0.5">
      <span *ngIf="activeView === 'activity'">Vista general de actividad en tiempo real</span>
      <span *ngIf="activeView === 'traffic'">Trafico de datos, recursos e integraciones</span>
      <span *ngIf="activeView === 'stats'">Estadisticas, tendencias y analisis</span>
    </p>
  </div>

  <app-dashboard-activity *ngIf="activeView === 'activity'"></app-dashboard-activity>
  <app-dashboard-traffic *ngIf="activeView === 'traffic'"></app-dashboard-traffic>
  <app-dashboard-statistics *ngIf="activeView === 'stats'"></app-dashboard-statistics>
</div>
