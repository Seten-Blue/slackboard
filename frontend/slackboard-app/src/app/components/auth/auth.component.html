<div class="min-h-screen flex items-center justify-center bg-ink-950 relative overflow-hidden px-4">
  <div class="pointer-events-none absolute -top-32 -left-24 w-96 h-96 rounded-full bg-signal/20 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-pulse/20 blur-3xl" aria-hidden="true"></div>

  <div class="relative w-full max-w-sm bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-7">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-signal to-pulse flex items-center justify-center mx-auto mb-4 shadow-lg shadow-signal/30">
        <span class="font-display font-bold text-white text-lg">S</span>
      </div>
      <h1 class="font-display font-semibold text-xl text-white">
        {{ mode === 'login' ? 'Ingresá a SlackBoard' : 'Creá tu cuenta' }}
      </h1>
      <p class="text-sm text-white/40 mt-1.5 flex items-center justify-center gap-1.5">
        <span class="relative flex h-1.5 w-1.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pulse opacity-75"></span>
          <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-pulse"></span>
        </span>
        {{ mode === 'login' ? 'Bienvenido de nuevo' : 'Empezá a usar SlackBoard en segundos' }}
      </p>
    </div>

    <div *ngIf="errorMsg" class="mb-4 px-3 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      {{ errorMsg }}
    </div>

    <div id="googleButtonContainer" class="flex justify-center mb-5"></div>

    <div class="relative flex items-center mb-5">
      <div class="flex-1 border-t border-white/10"></div>
      <span class="px-3 text-xs text-white/30">o con tu email</span>
      <div class="flex-1 border-t border-white/10"></div>
    </div>

    <form (ngSubmit)="submit()" class="space-y-3.5">
      <div *ngIf="mode === 'register'">
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Nombre de usuario</label>
        <input type="text" [(ngModel)]="username" name="username"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors" />
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Email</label>
        <input type="email" [(ngModel)]="email" name="email"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors" />
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Contraseña</label>
          <a *ngIf="mode === 'login'" routerLink="/forgot-password" class="text-[11px] text-signal hover:underline">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
        <input type="password" [(ngModel)]="password" name="password"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors" />
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full mt-2 py-3 rounded-lg bg-gradient-to-r from-signal to-signal/80 text-white font-medium text-sm hover:shadow-lg hover:shadow-signal/30 disabled:opacity-50 transition-all">
        {{ loading ? 'Un momento…' : (mode === 'login' ? 'Ingresar' : 'Crear cuenta') }}
      </button>
    </form>

    <p class="text-center text-sm text-white/40 mt-6">
      {{ mode === 'login' ? '¿No tenés cuenta?' : '¿Ya tenés cuenta?' }}
      <button (click)="toggleMode()" class="text-signal font-medium hover:underline">
        {{ mode === 'login' ? 'Creá una' : 'Ingresá' }}
      </button>
    </p>
  </div>
</div>w
