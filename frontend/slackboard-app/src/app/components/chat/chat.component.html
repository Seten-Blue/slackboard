<div class="flex flex-col h-full min-h-0 overflow-hidden bg-paper">
  <!-- Header del canal -->
  <header class="flex-shrink-0 bg-white/80 backdrop-blur border-b border-ink-950/10 px-6 py-4">
    <div *ngIf="currentChannel" class="flex items-center justify-between">
      <div>
        <h2 class="font-display font-semibold text-lg text-ink-950 flex items-center gap-2">
          <span class="text-ink-950/30 font-mono text-base">{{ currentChannel.isPrivate ? '🔒' : '#' }}</span>
          {{ currentChannel.displayName || currentChannel.name }}
        </h2>
        <p class="text-sm text-ink-950/50" *ngIf="currentChannel.description">{{ currentChannel.description }}</p>
      </div>
      <div class="hidden sm:flex items-center gap-1.5 text-xs font-mono text-ink-950/40" *ngIf="currentChannel.members">
        <span class="w-1.5 h-1.5 rounded-full bg-pulse"></span>
        {{ currentChannel.members.length }} miembros
      </div>
    </div>
    <div *ngIf="!currentChannel" class="text-ink-950/40 text-sm">
      Selecciona un canal para empezar
    </div>
  </header>

  <!-- Área de mensajes -->
  <app-message-area
    [channel]="currentChannel"
    class="flex-1 min-h-0">
  </app-message-area>
</div>
