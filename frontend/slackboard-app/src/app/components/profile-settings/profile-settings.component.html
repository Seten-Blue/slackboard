<div class="min-h-screen flex items-center justify-center bg-ink-950 relative overflow-hidden px-4">
  <div class="pointer-events-none absolute -top-32 -left-24 w-96 h-96 rounded-full bg-signal/20 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-pulse/20 blur-3xl" aria-hidden="true"></div>

  <div class="relative w-full max-w-sm bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-7">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-signal to-pulse flex items-center justify-center mx-auto mb-4 shadow-lg shadow-signal/30">
        <span class="font-display font-bold text-white text-lg">S</span>
      </div>
      <h1 class="font-display font-semibold text-xl text-white">Mi Perfil</h1>
      <p class="text-sm text-white/40 mt-1.5">Actualiza tu informacion personal</p>
    </div>

    <div *ngIf="errorMsg" class="mb-4 px-3 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      {{ errorMsg }}
    </div>

    <div *ngIf="successMsg" class="mb-4 px-3 py-2 rounded-lg bg-green-500/10 border border-green-500/20 text-green-400 text-sm">
      {{ successMsg }}
    </div>

    <form (ngSubmit)="save()" class="space-y-3.5">
      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Nombre de usuario</label>
        <input type="text" [(ngModel)]="username" name="username"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
               placeholder="Tu nombre para mostrar" />
        <p class="text-[10px] text-white/30 mt-1">Este nombre se mostrara en los mensajes que envies a Slack y Discord</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Nombre</label>
          <input type="text" [(ngModel)]="nombre" name="nombre"
                 class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
                 placeholder="Tu nombre" />
        </div>
        <div>
          <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Apellido</label>
          <input type="text" [(ngModel)]="apellido" name="apellido"
                 class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
                 placeholder="Tu apellido" />
        </div>
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Telefono</label>
        <input type="tel" [(ngModel)]="telefono" name="telefono"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
               placeholder="+54 11 1234-5678" />
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">Idioma</label>
        <input type="text" [(ngModel)]="idioma" name="idioma"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
               placeholder="es, en, pt, etc." />
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-wider font-mono text-white/40">URL del avatar (opcional)</label>
        <input type="url" [(ngModel)]="avatar" name="avatar"
               class="w-full mt-1.5 px-3 py-2.5 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-signal/60 text-sm text-white placeholder:text-white/20 transition-colors"
               placeholder="https://ejemplo.com/avatar.jpg" />
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" (click)="goBack()"
                class="flex-1 py-3 rounded-lg bg-white/5 border border-white/10 text-white/60 font-medium text-sm hover:bg-white/10 transition-all">
          Cancelar
        </button>
        <button type="submit" [disabled]="loading"
                class="flex-1 py-3 rounded-lg bg-gradient-to-r from-signal to-signal/80 text-white font-medium text-sm hover:shadow-lg hover:shadow-signal/30 disabled:opacity-50 transition-all">
          {{ loading ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
