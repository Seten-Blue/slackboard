<div class="thread-card" *ngIf="message?.threadData" (click)="onOpenThread()">
  <div class="thread-header">
    <div class="thread-icon-wrap">
      <span class="thread-icon">💬</span>
    </div>
    <div class="thread-info">
      <p class="thread-title">{{ threadTitle }}</p>
      <p class="thread-sub">Hilo de conversacion</p>
    </div>
  </div>
  <div *ngIf="threadMessage" class="thread-body">
    <p class="thread-message">{{ threadMessage }}</p>
  </div>
  <div class="thread-footer">
    <div class="thread-stats">
      <span class="thread-badge" *ngIf="replyCount > 0">
        💬 {{ replyCount }} {{ replyCount === 1 ? 'respuesta' : 'respuestas' }}
      </span>
      <span class="thread-badge" *ngIf="replyCount === 0">
        🧵 Hilo abierto
      </span>
      <div class="thread-participants" *ngIf="participants.length > 0">
        <div class="participant-avatars">
          <img *ngFor="let p of participants.slice(0, 4)"
               [src]="p?.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=default'"
               [alt]="p?.username"
               class="participant-avatar">
          <span *ngIf="participants.length > 4" class="participant-more">
            +{{ participants.length - 4 }}
          </span>
        </div>
      </div>
    </div>
    <span class="thread-open-hint">Click para abrir →</span>
  </div>
</div>
