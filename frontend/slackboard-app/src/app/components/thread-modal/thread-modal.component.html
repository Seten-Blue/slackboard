<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-ink-950/40 backdrop-blur-sm" (click)="onClose()"></div>

  <div class="relative bg-paper rounded-2xl shadow-2xl w-full max-w-lg mx-4 border border-ink-950/10">
    <div class="flex items-center justify-between px-6 pt-6">
      <div class="flex items-center gap-3">
        <span class="text-2xl">💬</span>
        <h2 class="text-lg font-semibold text-ink-950">Crear hilo</h2>
      </div>
      <button
        (click)="onClose()"
        class="text-ink-950/40 hover:text-ink-950 transition-colors rounded-lg p-1 hover:bg-ink-950/5"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <div class="px-6 py-5 space-y-4">
      <div>
        <label for="thread-title" class="block text-sm font-medium text-ink-950 mb-1.5">
          Titulo del hilo
        </label>
        <input
          id="thread-title"
          type="text"
          [(ngModel)]="title"
          placeholder="Ej: Discusion sobre la nueva feature..."
          class="w-full px-3.5 py-2.5 rounded-xl border border-ink-950/10 bg-paper text-ink-950 placeholder:text-ink-950/30 focus:outline-none focus:ring-2 focus:ring-signal/30 focus:border-signal transition-all text-sm"
        />
      </div>

      <div>
        <label for="thread-message" class="block text-sm font-medium text-ink-950 mb-1.5">
          Mensaje inicial (opcional)
        </label>
        <textarea
          id="thread-message"
          [(ngModel)]="initialMessage"
          placeholder="Escribe el primer mensaje del hilo..."
          rows="3"
          class="w-full px-3.5 py-2.5 rounded-xl border border-ink-950/10 bg-paper text-ink-950 placeholder:text-ink-950/30 focus:outline-none focus:ring-2 focus:ring-signal/30 focus:border-signal transition-all text-sm resize-none"
        ></textarea>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 px-6 pb-6">
      <button
        (click)="onClose()"
        class="px-4 py-2 text-sm font-medium text-ink-950/70 border border-ink-950/10 rounded-xl hover:bg-ink-950/5 transition-colors"
      >
        Cancelar
      </button>
      <button
        (click)="onSubmit()"
        [disabled]="!canSubmit"
        class="px-4 py-2 text-sm font-medium text-white bg-signal rounded-xl hover:bg-signal/90 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Crear hilo
      </button>
    </div>
  </div>
</div>
